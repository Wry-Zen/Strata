# 文章元数据自动生成：push 涉及 .md 时重建 meta.json 并回提仓库。
# 编号由工作流增量分配：已有编号永久保留，新文章取最大编号 +1，不复用。
# v3 条目附两项元数据：标题（文中第一个 # 行，缺省回落文件名）与 blob sha
# （git 内容指纹，与路径/提交无关）。前者让页面零正文渲染清单，后者支撑
# 正文本地缓存——sha 不变即内容未变，页面只重拉变化的篇目。
# GITHUB_TOKEN 的回提不会再触发 workflow（GitHub 防递归设计），不存在循环。
name: 更新文章元数据

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/meta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 meta.json
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess

          README = 'readme.md'  # 根目录仓库说明，不计入文章
          TITLE_RE = re.compile(r'^#\s+(.+?)\s*$')

          # 读取既有编号；v1 纯路径数组按原顺序迁移
          old = {}
          if os.path.exists('meta.json'):
              try:
                  data = json.load(open('meta.json', encoding='utf-8'))
                  items = data.get('articles', [])
                  if data.get('version') in (2, 3):
                      old = {a['path']: a['id'] for a in items}
                  else:
                      old = {p: i + 1 for i, p in enumerate(items) if isinstance(p, str)}
              except (ValueError, KeyError, TypeError):
                  old = {}

          # HEAD 树逐文件的 blob sha（-z 防中文路径被转义引用）
          shas = {}
          out = subprocess.run(['git', 'ls-tree', '-r', '-z', 'HEAD'],
                               capture_output=True, check=True).stdout
          for entry in out.split(b'\0'):
              if entry:
                  info, path = entry.split(b'\t', 1)
                  shas[path.decode('utf-8')] = info.split()[2].decode()

          # 枚举规则与目录遍历等价：任意深度 .md、跳过点目录、排除根 readme
          paths = [p for p in shas
                   if p.lower().endswith('.md') and p.lower() != README
                   and not any(d.startswith('.') for d in p.split('/')[:-1])]
          paths.sort()

          # 标题：文中第一个 # 行，缺省回落文件名（去扩展名）
          def title_of(path):
              try:
                  with open(path, encoding='utf-8', errors='replace') as f:
                      for line in f:
                          m = TITLE_RE.match(line)
                          if m:
                              return m.group(1)
              except OSError:
                  pass
              return os.path.splitext(os.path.basename(path))[0]

          # 保留旧编号，新文件按最大编号 +1 追加
          next_id = max(old.values(), default=0) + 1
          articles = []
          for p in paths:
              if p in old:
                  a_id = old[p]
              else:
                  a_id = next_id
                  next_id += 1
              articles.append({'id': a_id, 'path': p, 'title': title_of(p), 'sha': shas[p]})
          articles.sort(key=lambda a: a['id'])

          with open('meta.json', 'w', encoding='utf-8') as fp:
              json.dump({'version': 3, 'articles': articles}, fp, ensure_ascii=False, indent=2)
          print(f'共 {len(articles)} 篇文章')
          EOF

      - name: 提交 meta.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json
          git diff --cached --quiet || git commit -m "chore: 更新 meta.json"
          git push
